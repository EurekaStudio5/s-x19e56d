<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Portfolio</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#4a4a50;font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:15px}
p{margin:0;padding:0 16px;text-align:center}
</style>
</head>
<body>
<p id="msg">読み込み中…</p>
<script>
(async function () {
  var msg = document.getElementById('msg');
  try {
    var m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
    if (!m) { msg.textContent = 'このページは公開されていません。'; return; }
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var raw = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var buf = new Uint8Array(await (await fetch('d/p.bin')).arrayBuffer());
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    msg.textContent = 'このページは公開されていません。';
  }
})();
</script>
</body>
</html>
